services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: lenny
      POSTGRES_DB: lenny_growth_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/enable-pgvector.sql:/docker-entrypoint-initdb.d/enable-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny_growth_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
